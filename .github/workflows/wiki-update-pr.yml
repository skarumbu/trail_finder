name: Wiki Update PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

jobs:
  wiki-update-pr:
    # Skip PRs opened by this automation itself (design-doc/*, wiki-update/*,
    # or authored by github-actions[bot]) — otherwise each generated PR
    # re-triggers this workflow on itself, cascading indefinitely.
    if: |
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.head_ref, 'design-doc/') &&
      !startsWith(github.head_ref, 'wiki-update/')
    permissions:
      pull-requests: write
    uses: skarumbu/my-website/.github/workflows/wiki-update-pr-reusable.yml@main
    with:
      repo_name: trail-finder
    secrets:
      ARCH_CONTENT_FOUNDRY_KEY: ${{ secrets.ARCH_CONTENT_FOUNDRY_KEY }}
      WIKI_UPDATE_GH_TOKEN: ${{ secrets.WIKI_UPDATE_GH_TOKEN }}
